<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse top Brawlhalla MAKO ranked players.">
    <meta name="theme-color" content="#ff0000">
    <title>MAKO rankings</title>
    <link rel="icon" type="image/png" href="../../../images/favicon.png">
    <link rel="stylesheet" href="../../../styles.css?v=20260905-8">
  </head>
  <body class="theme-brawlhalla-rankings">
    <header class="site-header">
      <nav class="navbar">
        <a class="home-logo" href="../../../index.html" aria-label="Home">
          <img src="../../../images/dvd.png" alt="">
        </a>
        <h1 class="titlebar">THETRUETRIDENT</h1>
        <div class="brawlhalla-nav">
          <a href="../../maps/">maps</a>
          <a href="../../mlojnir/">mlojnir</a>
          <a href="../../colors/">colors</a>
          <a class="active" href="../">rankings</a>
          <a href="https://www.youtube.com/@thetruetrident">content</a>
        </div>
      </nav>
    </header>

    <main class="rankings-page">
      <section class="rankings-hero">
        <div>
          <p class="rankings-kicker">BRAWLHALLA LEGEND LEADERBOARD</p>
          <h1>RANKINGS</h1>
        </div>
        <form class="rankings-controls" aria-label="Ranking controls">
          <label for="legend-select">
            <span>LEGEND</span>
            <select id="legend-select" disabled>
              <option>Loading legends</option>
            </select>
          </label>
          <label for="region-select">
            <span>REGION</span>
            <select id="region-select">
              <option value="US-E" selected>US-E</option>
              <option value="US-W">US-W</option>
              <option value="EU">EU</option>
              <option value="SEA">SEA</option>
              <option value="BRZ">BRZ</option>
              <option value="AUS">AUS</option>
              <option value="JPS">JPS</option>
              <option value="SA">SA</option>
              <option value="ME">ME</option>
              <option value="ALL">ALL</option>
            </select>
          </label>
        </form>
      </section>

      <section class="rankings-board" aria-label="Legend rankings">
        <p id="rankings-status" class="rankings-status" role="status" aria-live="polite">Loading Brawlhalla legends...</p>

        <ol id="rankings-body" class="rankings-list">
          <li class="rankings-empty">Loading...</li>
        </ol>
      </section>
    </main>

    <script src="../rankings.js?v=20260905-8"></script>
  </body>
</html>
